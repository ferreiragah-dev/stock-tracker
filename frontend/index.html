<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Bem-vindo</p>
        <h1>Dashboard do usuário</h1>
        <nav class="app-nav" aria-label="Seções principais">
          <a class="nav-link active" href="index.html">Dashboard</a>
          <a class="nav-link" href="alertas.html">Alertas</a>
          <a class="nav-link" href="conta.html">Conta</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="dashboard">
        <div class="dashboard-header">
          <div>
            <h2>Ações rápidas</h2>
            <p class="muted">Atalhos para as ações principais do seu painel.</p>
          </div>
        </div>
        <div class="action-grid">
          <button class="action-card">
            <span class="action-title">Adicionar alerta</span>
            <span class="muted">Crie um novo alerta para ativos.</span>
          </button>
          <button class="action-card">
            <span class="action-title">Ver alertas</span>
            <span class="muted">Acompanhe seus alertas ativos.</span>
          </button>
          <button class="action-card">
            <span class="action-title">Gerenciar conta</span>
            <span class="muted">Atualize nome, e-mail e senha.</span>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
