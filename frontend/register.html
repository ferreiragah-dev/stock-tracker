<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Tracker | Cadastro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Cadastro</p>
        <h1>Crie sua conta</h1>
      </div>
      <a class="primary" href="index.html">Voltar ao dashboard</a>
    </header>

    <main>
      <section class="auth-card">
        <div class="auth-header">
          <div>
            <h2>Novo cadastro</h2>
            <p class="muted">Configure seu acesso para monitorar seus ativos.</p>
          </div>
          <span class="tag success">Gratuito</span>
        </div>

        <form class="auth-form">
          <label class="field">
            <span>Nome completo</span>
            <input type="text" placeholder="Seu nome" required />
          </label>
          <label class="field">
            <span>E-mail</span>
            <input type="email" placeholder="nome@empresa.com" required />
          </label>
          <label class="field">
            <span>Senha</span>
            <input type="password" placeholder="Crie uma senha forte" required />
          </label>
          <label class="field">
            <span>Confirmar senha</span>
            <input type="password" placeholder="Repita sua senha" required />
          </label>
          <label class="toggle small remember">
            <input type="checkbox" checked />
            <span class="slider"></span>
            <span class="toggle-label">Aceito receber alertas e novidades</span>
          </label>
          <button class="primary auth-submit" type="submit">Criar conta</button>
        </form>

        <p class="muted auth-footer">
          Já possui conta?
          <a href="login.html">Entrar agora</a>
        </p>
      </section>
    </main>
  </body>
</html>
