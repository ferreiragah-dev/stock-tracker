<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Tracker | Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Acesso</p>
        <h1>Entrar no Stock Tracker</h1>
      </div>
      <a class="primary" href="index.html">Voltar ao dashboard</a>
    </header>

    <main>
      <section class="auth-card">
        <div class="auth-header">
          <div>
            <h2>Login</h2>
            <p class="muted">Digite seus dados para acessar sua carteira.</p>
          </div>
          <span class="tag success">Seguro</span>
        </div>

        <form class="auth-form">
          <label class="field">
            <span>E-mail</span>
            <input type="email" placeholder="nome@empresa.com" required />
          </label>
          <label class="field">
            <span>Senha</span>
            <input type="password" placeholder="••••••••" required />
          </label>
          <label class="toggle small remember">
            <input type="checkbox" checked />
            <span class="slider"></span>
            <span class="toggle-label">Lembrar deste dispositivo</span>
          </label>
          <button class="primary auth-submit" type="submit">Entrar</button>
        </form>

        <p class="muted auth-footer">
          Ainda não tem conta?
          <a href="register.html">Criar cadastro</a>
        </p>
      </section>
    </main>
  </body>
</html>
