<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Tracker | Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Acesso</p>
        <h1>Entrar no Stock Tracker</h1>
      </div>
      <a class="primary" href="index.html">Voltar ao dashboard</a>
    </header>

    <main>
      <section class="auth-card">
        <div class="auth-header">
          <div>
            <h2>Login</h2>
            <p class="muted">Digite seus dados para acessar sua carteira.</p>
          </div>
          <span class="tag success">Seguro</span>
        </div>

        <form class="auth-form" id="login-form">
          <label class="field">
            <span>E-mail</span>
            <input id="login-email" type="email" placeholder="nome@empresa.com" required />
          </label>
          <label class="field">
            <span>Senha</span>
            <input id="login-password" type="password" placeholder="••••••••" required />
          </label>
          <label class="toggle small remember">
            <input type="checkbox" checked />
            <span class="slider"></span>
            <span class="toggle-label">Lembrar deste dispositivo</span>
          </label>
          <p class="muted" id="login-feedback" role="alert" aria-live="polite"></p>
          <button class="primary auth-submit" type="submit">Entrar</button>
        </form>

        <p class="muted auth-footer">
          Ainda não tem conta?
          <a href="register.html">Criar cadastro</a>
        </p>
      </section>
    </main>
    <script>
      const form = document.querySelector("#login-form");
      const feedback = document.querySelector("#login-feedback");
      const emailInput = document.querySelector("#login-email");
      const passwordInput = document.querySelector("#login-password");

      const setFeedback = (message, isError = false) => {
        feedback.textContent = message;
        feedback.style.color = isError ? "#f15b5b" : "#7ce7ac";
      };

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        setFeedback("");

        const payload = {
          email: emailInput.value.trim(),
          password: passwordInput.value
        };

        if (!payload.email || !payload.password) {
          setFeedback("Preencha e-mail e senha para continuar.", true);
          return;
        }

        try {
          const response = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Não foi possível fazer login.");
          }

          localStorage.setItem("authToken", data.token);
          setFeedback("Login realizado! Redirecionando...");
          window.location.href = "index.html";
        } catch (error) {
          setFeedback(error.message, true);
        }
      });
    </script>
  </body>
</html>
